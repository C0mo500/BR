[package]
name = "br"
description = "BR: a media suite. BR Foto (simple photo editing with LightCraft's full Pro interface), a command line and an MCP server for AI agents"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "br"
path = "src/main.rs"

# As LightCraft's desktop app: AI object masks (SAM 3, the model is downloaded when first used), AI
# denoise and HEIC/HEIF photos, all pure Rust. HEIC is in the default build here; whoever ships BR
# where HEVC patents matter builds with `--no-default-features --features sam,denoise`.
[features]
default = ["sam", "denoise", "heif", "audio", "whisper"]
# sound for video playback (cpal; on Linux it builds against the ALSA headers, libasound2-dev)
audio = ["br-ui/audio"]
# automatic captions: Whisper on the CPU; the model (about 150 MB) is downloaded on first use
whisper = ["br-ui/whisper"]
sam = ["lightcraft-engine/sam"]
denoise = ["lightcraft-engine/denoise"]
heif = ["lightcraft-codecs/heif"]

[dependencies]
br-photo = { workspace = true }
br-mcp = { workspace = true }
br-ui = { workspace = true }
br-video = { workspace = true }
filmcraft-engine = { workspace = true }
lightcraft-engine = { workspace = true }
lightcraft-codecs = { workspace = true }
lightcraft-sysmem = { workspace = true }
lightcraft-mcp = { workspace = true }
lightcraft-ui-egui = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
serde_json = { workspace = true }
log = { workspace = true }

[lints]
workspace = true

# file drag-and-drop needs X11 (XWayland) on Linux: winit has none on Wayland
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }
