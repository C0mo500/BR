[package]
name = "br"
description = "BR: a media suite. BR Foto (simple photo editing with LightCraft's full Pro interface), a command line and an MCP server for AI agents"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "br"
path = "src/main.rs"

[dependencies]
br-photo = { workspace = true }
br-mcp = { workspace = true }
br-ui = { workspace = true }
lightcraft-engine = { workspace = true }
lightcraft-mcp = { workspace = true }
lightcraft-ui-egui = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "glow", "accesskit", "wayland", "x11"] }
serde_json = { workspace = true }
log = { workspace = true }

[lints]
workspace = true

# file drag-and-drop needs X11 (XWayland) on Linux: winit has none on Wayland
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }
